# =============================================================================
#  Aprovisionamiento declarativo del datasource - Parcial 2 Comunicaciones
#  Ruta en el contenedor: /etc/grafana/provisioning/datasources/datasource.yml
#
#  Grafana lee este archivo en cada arranque; no se toca la interfaz grafica.
#  Las variables ${...} se resuelven con el entorno del contenedor grafana
#  (definido en docker-compose.yml a partir de .env).
#
#  El acceso es de tipo "proxy": el navegador nunca habla con PostgreSQL; es el
#  backend de Grafana (dentro de backend_net) quien abre la conexion TCP/5432.
# =============================================================================
apiVersion: 1

# Nota: no se declara 'deleteDatasources'. El datasource se identifica por un
# uid fijo, asi que cada arranque lo actualiza en su sitio; borrarlo primero
# abriria una ventana de unos segundos en la que los paneles ya abiertos en un
# navegador consultarian un origen inexistente y mostrarian error.

datasources:
  - name: PostgreSQL-Observabilidad
    uid: pg_observabilidad
    type: grafana-postgresql-datasource
    access: proxy
    orgId: 1
    isDefault: true
    editable: false

    # Capa 3/4: nombre de servicio resuelto por el DNS interno + puerto TCP 5432
    url: database:5432

    # Rol de SOLO LECTURA creado por database/initdb/02-rol-grafana.sh
    user: ${GRAFANA_DB_USER}
    database: ${POSTGRES_DB}

    secureJsonData:
      password: ${GRAFANA_DB_PASSWORD}

    jsonData:
      database: ${POSTGRES_DB}
      sslmode: disable          # trafico interno del bridge, sin salida al host
      postgresVersion: 1600     # PostgreSQL 16
      timescaledb: false
      # Pool de conexiones persistentes (Capa 4): se reutilizan sockets TCP
      # en lugar de abrir uno nuevo por consulta de panel.
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400
