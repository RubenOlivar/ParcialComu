# =============================================================================
#  Edge Router / Proxy inverso - Parcial 2 Comunicaciones (UMNG)
#  Contexto: este archivo se incluye dentro del bloque http{} de nginx.conf
#
#  Enrutamiento por prefijo (Capa 7):
#     /          -> joomla:80    (CMS institucional)
#     /jupyter/  -> jupyter:8888 (HTTP + WebSocket para los kernels)
#     /grafana/  -> grafana:3000 (paneles, servidos bajo subpath)
# =============================================================================

# -----------------------------------------------------------------------------
# 1) Formato de registro JSON.
#    Se escribe en un volumen compartido para que PostgreSQL lo parsee con
#    pg_read_file() y Grafana lo consulte como vistas SQL (ver INFORME.md).
#    escape=json garantiza que User-Agent/URI con comillas no rompan el JSON.
# -----------------------------------------------------------------------------
log_format edge_json escape=json
  '{'
    '"ts":"$time_iso8601",'
    '"remote_addr":"$remote_addr",'
    '"xff":"$http_x_forwarded_for",'
    '"host":"$host",'
    '"metodo":"$request_method",'
    '"uri":"$uri",'
    '"args":"$args",'
    '"protocolo":"$server_protocol",'
    '"status":$status,'
    '"bytes":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"upstream_addr":"$upstream_addr",'
    '"upstream_status":"$upstream_status",'
    '"upstream_time":"$upstream_response_time",'
    '"servicio":"$servicio",'
    '"upgrade":"$http_upgrade",'
    '"referer":"$http_referer",'
    '"user_agent":"$http_user_agent"'
  '}';

# -----------------------------------------------------------------------------
# 2) Mapa para el handshake de WebSockets (Capa 7 - HTTP Upgrade).
#    Si el cliente envia "Upgrade: websocket" se responde con
#    "Connection: upgrade"; en peticiones HTTP normales se cierra el tunel.
# -----------------------------------------------------------------------------
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Tamano maximo de subida (paquetes de instalacion / adjuntos de Joomla)
client_max_body_size 64m;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # -------------------------------------------------------------------------
    # DNS embebido de Docker (Capa 3/7): resolver los nombres de servicio en
    # tiempo de peticion -y no solo al arrancar- permite que Nginx sobreviva
    # al reinicio o cambio de IP de cualquier backend.
    # -------------------------------------------------------------------------
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # Las redirecciones propias del edge se emiten como URI relativa. Nginx
    # escucha en el puerto 80 del contenedor, por lo que una redireccion
    # absoluta omitiria el puerto publicado en el host (p. ej. 8080) y
    # enviaria al navegador a una direccion inexistente.
    absolute_redirect off;

    set $upstream_joomla  joomla:80;
    set $upstream_jupyter jupyter:8888;
    set $upstream_grafana grafana:3000;

    # Etiqueta del servicio destino; se emite en cada linea del log JSON.
    set $servicio "otros";

    # -------------------------------------------------------------------------
    # Registro de accesos: a stdout (docker logs) y al volumen compartido.
    # -------------------------------------------------------------------------
    access_log /var/log/nginx/access.log main;
    access_log /var/log/nginx/shared/access.json.log edge_json;
    error_log  /var/log/nginx/error.log warn;

    # Cabeceras comunes inyectadas hacia todos los upstreams (Capa 7).
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;
    proxy_http_version 1.1;

    # -------------------------------------------------------------------------
    # Sonda de salud del propio edge (usada por el healthcheck de Compose).
    # -------------------------------------------------------------------------
    location = /healthz {
        set $servicio "edge";
        default_type text/plain;
        return 200 "edge-ok\n";
    }

    # Metricas basicas del proxy (solo alcanzables desde las redes internas).
    location = /nginx_status {
        set $servicio "edge";
        stub_status;
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        deny all;
    }

    # -------------------------------------------------------------------------
    # /jupyter -> contenedor jupyter (JupyterLab con base_url=/jupyter)
    # Requiere HTTP/1.1 + Upgrade/Connection para los WebSockets del kernel.
    # -------------------------------------------------------------------------
    location = /jupyter { return 301 /jupyter/; }

    location /jupyter/ {
        set $servicio "jupyter";
        proxy_pass http://$upstream_jupyter;

        # --- Handshake de WebSocket (RFC 6455 sobre HTTP/1.1) ---
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Los canales /api/kernels/<id>/channels son de larga duracion:
        # se amplian los temporizadores y se desactiva el buffering.
        proxy_buffering     off;
        proxy_read_timeout  86400s;
        proxy_send_timeout  86400s;
    }

    # -------------------------------------------------------------------------
    # /grafana -> contenedor grafana
    # Grafana corre con GF_SERVER_SERVE_FROM_SUB_PATH=true, de modo que espera
    # recibir el prefijo /grafana/ intacto (no se reescribe la URI).
    # -------------------------------------------------------------------------
    location = /grafana { return 301 /grafana/; }

    # Aterrizaje directo en el dashboard aprovisionado: el evaluador abre
    # /grafana/ y ve los paneles sin navegar por la interfaz.
    location = /grafana/ {
        set $servicio "grafana";
        return 302 /grafana/d/parcial2-observabilidad/;
    }

    location /grafana/ {
        set $servicio "grafana";
        proxy_pass http://$upstream_grafana;

        # Grafana Live (streaming de paneles) tambien usa WebSockets.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
    }

    # -------------------------------------------------------------------------
    # /  -> contenedor joomla (portal institucional y backend /administrator)
    # -------------------------------------------------------------------------
    location / {
        set $servicio "joomla";
        proxy_pass http://$upstream_joomla;

        proxy_connect_timeout 10s;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
    }

    # Pagina de error propia del edge cuando un backend no responde.
    error_page 502 503 504 /edge_error.html;
    location = /edge_error.html {
        internal;
        default_type text/html;
        return 503 '<!doctype html><meta charset="utf-8"><title>Servicio iniciando</title><body style="font-family:system-ui;padding:2rem"><h1>503 - Backend no disponible</h1><p>El servicio solicitado aun esta iniciando o no responde. Reintente en unos segundos.</p><p><a href="/">Portal Joomla</a> | <a href="/jupyter/">Jupyter</a> | <a href="/grafana/">Grafana</a></p></body>';
    }
}
