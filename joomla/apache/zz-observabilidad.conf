# =============================================================================
#  Joomla / Apache 2.4 - Observabilidad para el Parcial 2 (UMNG)
#  Montado en /etc/apache2/conf-enabled/zz-observabilidad.conf
#
#  Objetivo: exponer el access log del CMS en formato JSON sobre el volumen
#  compartido /var/log/apache2 (joomla_logs) para que PostgreSQL lo parsee y
#  Grafana lo grafique, sin configuracion manual.
# =============================================================================

# -----------------------------------------------------------------------------
# 1) Confianza en el proxy inverso (Capa 7)
#    mod_remoteip reemplaza la IP de la conexion TCP (la del contenedor nginx)
#    por la IP real del cliente tomada de la cabecera X-Forwarded-For, de modo
#    que %a registre al navegador y no al proxy.
#    Las redes 172.28.10.0/24 y 172.28.20.0/24 son los bridges del despliegue.
# -----------------------------------------------------------------------------
RemoteIPHeader X-Forwarded-For
RemoteIPInternalProxy 172.28.10.0/24
RemoteIPInternalProxy 172.28.20.0/24

# -----------------------------------------------------------------------------
# 2) Formato JSON de una linea por peticion.
#    %a  = IP real del cliente (tras mod_remoteip)
#    %{c}a = IP de la conexion TCP entrante (el contenedor nginx)
#    %>s = codigo HTTP final | %B = bytes del cuerpo | %D = duracion en us
# -----------------------------------------------------------------------------
LogFormat "{\"ts\":\"%{%Y-%m-%dT%H:%M:%S%z}t\",\"remote_addr\":\"%a\",\"proxy_addr\":\"%{c}a\",\"xff\":\"%{X-Forwarded-For}i\",\"host\":\"%{Host}i\",\"metodo\":\"%m\",\"uri\":\"%U\",\"query\":\"%q\",\"protocolo\":\"%H\",\"status\":%>s,\"bytes\":%B,\"duracion_us\":%D,\"referer\":\"%{Referer}i\",\"user_agent\":\"%{User-Agent}i\"}" joomla_json

# -----------------------------------------------------------------------------
# 3) Redefinicion del vhost por defecto.
#    En Apache los directivos de log declarados dentro de un <VirtualHost> NO
#    heredan los del servidor principal, por lo que el CustomLog JSON debe
#    declararse dentro del propio vhost que atiende a Joomla.
# -----------------------------------------------------------------------------
<VirtualHost *:80>
    ServerAdmin webmaster@umng.local
    DocumentRoot /var/www/html

    # Log legible (formato combined) - tambien util para 'docker compose logs'
    CustomLog /var/log/apache2/access.log combined

    # Log estructurado consumido por PostgreSQL + Grafana
    CustomLog /var/log/apache2/joomla_access.json.log joomla_json

    ErrorLog /var/log/apache2/error.log
    LogLevel warn

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
